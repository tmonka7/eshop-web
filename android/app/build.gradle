plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auramart.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.auramart.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // 10.0.2.2 is the host machine as seen from the Android emulator.
        buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:5000/api/v1/\""
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Point a release build at your deployed API.
            buildConfigField "String", "API_BASE_URL", "\"https://api.auramart.com/api/v1/\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    // The DINOv3 weights in assets/model are copied to internal storage on
    // first use; stored uncompressed, their size can be read to detect a
    // stale copy, and zip gains nothing on float weights anyway.
    androidResources {
        noCompress += ['onnx', 'onnx_data']
    }
}

// Image search runs the bundled DINOv3 model on the device, so the build must
// carry it. Fail early with instructions instead of shipping an app whose
// camera search silently falls back to uploading photos.
def dinov3Assets = file('src/main/assets/model')
tasks.register('checkDinov3Model') {
    description = 'Verifies the DINOv3 model is present in src/main/assets/model.'
    inputs.dir(dinov3Assets).optional()
    doLast {
        def missing = ['model.onnx', 'model.onnx_data', 'preprocessor_config.json']
                .findAll { !new File(dinov3Assets, it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("DINOv3 model files missing from ${dinov3Assets}: ${missing}. " +
                    "Run `npm run model:android` in the repository root (see backend/ml/README.md).")
        }
    }
}
tasks.named('preBuild') { dependsOn 'checkDinov3Model' }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    // Photo orientation for image search; fixes the framework class's bugs on older releases.
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // On-device DINOv3 inference; same runtime version as the backend.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
